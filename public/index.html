  <!-- Root Application Orchestration -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    function App() {
      // 0. SWR Local State Snapshot Cache for instantaneous zero-flicker cold starts
      const [data, setData] = useState(() => {
        try {
          const cached = localStorage.getItem('mevn_wms_state_cache');
          return cached ? JSON.parse(cached) : null;
        } catch (e) {
          return null;
        }
      });
      const [isInitialLoading, setIsInitialLoading] = useState(() => {
        try {
          const cached = localStorage.getItem('mevn_wms_state_cache');
          return !cached;
        } catch (e) {
          return true;
        }
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [fetchError, setFetchError] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('mevn_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('mevn_theme') === 'dark' ||
          (!localStorage.getItem('mevn_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      });
      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        return localStorage.getItem('mevn_sidebar_collapsed') === 'true';
      });
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);

      // Overlay & Inspection States
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [orderDrawerOpen, setOrderDrawerOpen] = useState(false);
      const [commandPaletteOpen, setCommandPaletteOpen] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'ORDER' | 'BOM' | 'PO' | 'GRN' | 'PICKUP' | 'GDN' | 'RETURN' | 'PRINT' | 'CONFIRM_DELETE'
      const [activeModalTarget, setActiveModalTarget] = useState(null);
      const [deleteConfirmTarget, setDeleteConfirmTarget] = useState(null);
      const [printPreviewData, setPrintPreviewData] = useState(null);
      const [toast, setToast] = useState(null);

      // Sync dark mode class with root html
      useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
        localStorage.setItem('mevn_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      // Sync sidebar state
      useEffect(() => {
        localStorage.setItem('mevn_sidebar_collapsed', sidebarCollapsed ? 'true' : 'false');
      }, [sidebarCollapsed]);

      const showToast = useCallback((msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      }, []);

      // Authenticated Fetch Helper with Automatic JWT Token Injection & 401/403 Handling
      const authFetch = useCallback(async (url, options = {}) => {
        const token = localStorage.getItem('mevn_auth_token');
        const headers = {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(url, {
          ...options,
          headers
        });

        if (response.status === 401) {
          localStorage.removeItem('mevn_auth_token');
          localStorage.removeItem('mevn_auth_user');
          setCurrentUser(null);
          showToast('Phiên làm việc đã hết hạn hoặc không hợp lệ. Vui lòng đăng nhập lại.', 'error');
        }

        return response;
      }, [showToast]);

      // Fetch Full System State with SWR Zero-Flicker Background Sync (Silent Revalidation)
      const fetchState = useCallback(async (isSilent = false) => {
        if (isSilent || data) {
          setIsSyncing(true);
        } else {
          setIsInitialLoading(true);
        }
        setFetchError(null);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        try {
          const res = await authFetch('/api/state', { signal: controller.signal });
          clearTimeout(timeoutId);
          let json;
          try {
            json = await res.json();
          } catch (jsonErr) {
            throw new Error(`Máy chủ phản hồi mã lỗi ${res.status} (${res.statusText}). Vui lòng kiểm tra Vercel Function Logs.`);
          }
          if (json.success) {
            setData(json.data);
            setFetchError(null);
            try {
              localStorage.setItem('mevn_wms_state_cache', JSON.stringify(json.data));
            } catch (e) {}
            // Refresh currentUser profile if still authenticated
            setCurrentUser(prevUser => {
              if (prevUser && json.data.users) {
                const refreshed = json.data.users.find(u => u.id === prevUser.id || u.username === prevUser.username);
                if (refreshed) {
                  localStorage.setItem('mevn_auth_user', JSON.stringify(refreshed));
                  return refreshed;
                }
              }
              return prevUser;
            });
          } else {
            const msg = json.message || 'Lỗi nạp dữ liệu từ máy chủ Supabase';
            if (!data) setFetchError(msg);
            showToast(msg, 'error');
          }
        } catch (err) {
          clearTimeout(timeoutId);
          console.error('[API Fetch Error]:', err);
          let msg = 'Không thể kết nối đến máy chủ WMS Supabase!';
          if (err.name === 'AbortError') {
            msg = 'Quá thời gian chờ phản hồi từ máy chủ (Timeout 30s). Vui lòng bấm [Thử Lại Kết Nối] hoặc kiểm tra cấu hình biến môi trường DATABASE_URL trên Vercel!';
          } else if (err.message) {
            msg = err.message;
          }
          if (!data) setFetchError(msg);
          showToast(msg, 'error');
        } finally {
          setIsInitialLoading(false);
          setIsSyncing(false);
        }
      }, [data, showToast, authFetch]);

      useEffect(() => {
        fetchState(false);
      }, []);

      // Global Shortcut (Ctrl+K / Cmd+K)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCommandPaletteOpen(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Auth & Role Handlers
      const handleLoginSuccess = (user, token) => {
        setCurrentUser(user);
        try {
          localStorage.setItem('mevn_auth_user', JSON.stringify(user));
          if (token) {
            localStorage.setItem('mevn_auth_token', token);
          }
        } catch (e) {}
        showToast(`Chào mừng ${user.fullName} (${user.role}) đăng nhập thành công!`);
        const { isTabAllowed, getRoleConfig } = window.WMS_CONSTANTS || {};
        if (isTabAllowed && !isTabAllowed(user, activeTab)) {
          const cfg = getRoleConfig ? getRoleConfig(user.role) : null;
          const firstTab = cfg?.allowedTabs?.[0] || 'dashboard';
          setActiveTab(firstTab);
        }
        fetchState(true);
      };

      const handleLogout = async () => {
        try {
          await authFetch('/api/auth/logout', { method: 'POST' });
        } catch (e) {}
        localStorage.removeItem('mevn_auth_user');
        localStorage.removeItem('mevn_auth_token');
        setCurrentUser(null);
        showToast('Đã đăng xuất an toàn khỏi hệ thống!');
      };

      const handleSwitchUser = (user) => {
        setCurrentUser(user);
        if (user) {
          try {
            localStorage.setItem('mevn_auth_user', JSON.stringify(user));
          } catch (e) {}
          const { isTabAllowed, getRoleConfig } = window.WMS_CONSTANTS || {};
          if (isTabAllowed && !isTabAllowed(user, activeTab)) {
            const cfg = getRoleConfig ? getRoleConfig(user.role) : null;
            const firstTab = cfg?.allowedTabs?.[0] || 'dashboard';
            setActiveTab(firstTab);
          }
          showToast(`Đã chuyển sang tài khoản: ${user.fullName} (${user.role})`);
        }
      };

      // Role Permission Guard
      const checkPerm = useCallback((perm, actionName) => {
        const { hasPermission } = window.WMS_CONSTANTS || {};
        if (hasPermission && !hasPermission(currentUser, perm)) {
          showToast(`Tài khoản (${currentUser?.role || 'Khách'}) không có quyền ${actionName}!`, 'error');
          return false;
        }
        return true;
      }, [currentUser, showToast]);

      // API Handlers (Optimistic UI & Zero-Latency Local Updates)
      const handleCreateOrder = async (payload) => {
        try {
          const bodyPayload = {
            ...payload,
            saleAdminId: currentUser?.id,
            createdById: currentUser?.id
          };
          // Đóng modal ngay lập tức để người dùng tiếp tục làm việc (0ms UI latency)
          setActiveModal(null);
          showToast(`Đang tạo đơn hàng [${payload.code || ''}]...`);

          const res = await authFetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyPayload)
          });
          const json = await res.json();
          if (json.success) {
            showToast(`Đã tạo thành công Đơn Hàng [${json.data?.code || payload.code || ''}]!`);
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                orders: [json.data, ...(prev.orders || []).filter(o => o.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi tạo đơn hàng', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleCreateBom = async (payload) => {
        try {
          setActiveModal(null);
          showToast('Đang nạp và đối chiếu BOM...');
          const res = await authFetch(`/api/orders/${payload.orderId}/boms`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã nạp và phát hành BOM thành công!');
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                boms: [json.data, ...(prev.boms || []).filter(b => b.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi nạp BOM', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleVerifyBom = async (bomId) => {
        try {
          setData(prev => {
            if (!prev) return prev;
            return {
              ...prev,
              boms: (prev.boms || []).map(b => b.id === bomId ? { ...b, status: 'VERIFIED' } : b)
            };
          });
          showToast('Đang đối chiếu và khóa giữ chỗ vật tư...');
          const res = await authFetch(`/api/boms/${bomId}/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ verifiedById: currentUser?.id })
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã đối chiếu tồn & tự động khóa giữ chỗ vật tư thành công!');
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi đối chiếu BOM', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleCreatePo = async (payload) => {
        try {
          setActiveModal(null);
          showToast('Đang phát hành Đơn Mua Hàng PO...');
          const res = await authFetch('/api/pos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã phát hành Đơn Mua Hàng PO thành công!');
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                purchaseOrders: [json.data, ...(prev.purchaseOrders || []).filter(p => p.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi tạo PO', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleCreateGrn = async (payload) => {
        try {
          setActiveModal(null);
          showToast('Đang tạo Phiếu Nhập Kho GRN...');
          const res = await authFetch('/api/grns', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã tạo Phiếu Nhập Kho GRN & Tự động giữ chỗ thành công!');
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                goodsReceiptNotes: [json.data, ...(prev.goodsReceiptNotes || []).filter(g => g.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi tạo GRN', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleCreatePickup = async (payload) => {
        try {
          setActiveModal(null);
          showToast('Đang gửi Đăng Ký Ca Lấy Vật Tư...');
          const res = await authFetch('/api/pickup-registrations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã gửi Đăng Ký Ca Lấy Vật Tư Mẫu 1!');
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                pickupRegistrations: [json.data, ...(prev.pickupRegistrations || []).filter(p => p.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi gửi đăng ký ca', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleCreateGdn = async (payload) => {
        try {
          setActiveModal(null);
          showToast('Đang lập Phiếu Xuất Kho PXK-BOM-01...');
          const res = await authFetch('/api/gdns', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã lập Phiếu Xuất Kho PXK-BOM-01 thành công!');
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                goodsDispatchNotes: [json.data, ...(prev.goodsDispatchNotes || []).filter(g => g.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi lập GDN', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleApproveGdn = async (gdnId) => {
        try {
          setData(prev => {
            if (!prev) return prev;
            return {
              ...prev,
              goodsDispatchNotes: (prev.goodsDispatchNotes || []).map(g => g.id === gdnId ? { ...g, status: 'APPROVED' } : g)
            };
          });
          showToast('Đang duyệt Phiếu Xuất Kho GDN...');
          const res = await authFetch(`/api/gdns/${gdnId}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ approvedById: currentUser?.id })
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã duyệt Phiếu Xuất Kho GDN!');
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi duyệt GDN', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleDispatchGdn = async (gdnId) => {
        try {
          setData(prev => {
            if (!prev) return prev;
            return {
              ...prev,
              goodsDispatchNotes: (prev.goodsDispatchNotes || []).map(g => g.id === gdnId ? { ...g, status: 'DISPATCHED' } : g)
            };
          });
          showToast('Đang thực xuất kho và cập nhật Sổ Cái...');
          const res = await authFetch(`/api/gdns/${gdnId}/dispatch`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          });
          const json = await res.json();
          if (json.success) {
            showToast('Thực xuất kho thành công! Đã trừ tồn và ghi Sổ cái bất biến.');
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi thực xuất kho', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleCreateReturn = async (payload) => {
        try {
          setActiveModal(null);
          showToast('Đang tạo Phiếu Nhập Trả...');
          const res = await authFetch('/api/returns', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            showToast('Đã tạo Phiếu Nhập Trả / Thu hồi phế phẩm thành công!');
            if (json.data) {
              setData(prev => prev ? {
                ...prev,
                stockReturnNotes: [json.data, ...(prev.stockReturnNotes || []).filter(r => r.id !== json.data.id)]
              } : prev);
            }
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi tạo phiếu nhập trả', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleDeleteEntity = async (target) => {
        if (!target || !target.id) return;
        try {
          let endpoint = '';
          if (target.type === 'ORDER') endpoint = `/api/orders/${target.id}`;
          else if (target.type === 'PO') endpoint = `/api/pos/${target.id}`;
          else if (target.type === 'GDN') endpoint = `/api/gdns/${target.id}`;
          else if (target.type === 'GRN') endpoint = `/api/grns/${target.id}`;
          else if (target.type === 'PICKUP') endpoint = `/api/pickup-registrations/${target.id}`;
          else if (target.type === 'RETURN') endpoint = `/api/returns/${target.id}`;

          if (!endpoint) {
            showToast('Loại chứng từ không hợp lệ để xóa', 'error');
            return;
          }

          // Optimistic UI: Đóng modal và xóa trực tiếp khỏi state để giao diện phản hồi 0ms
          setDeleteConfirmTarget(null);
          if (selectedOrder && (selectedOrder.id === target.id || target.type === 'ORDER')) {
            setOrderDrawerOpen(false);
            setSelectedOrder(null);
          }

          setData(prev => {
            if (!prev) return prev;
            const updated = { ...prev };
            if (target.type === 'ORDER') {
              updated.orders = (prev.orders || []).filter(o => o.id !== target.id);
            } else if (target.type === 'PO') {
              updated.purchaseOrders = (prev.purchaseOrders || []).filter(p => p.id !== target.id);
            } else if (target.type === 'GDN') {
              updated.goodsDispatchNotes = (prev.goodsDispatchNotes || []).filter(g => g.id !== target.id);
            } else if (target.type === 'GRN') {
              updated.goodsReceiptNotes = (prev.goodsReceiptNotes || []).filter(g => g.id !== target.id);
            } else if (target.type === 'PICKUP') {
              updated.pickupRegistrations = (prev.pickupRegistrations || []).filter(p => p.id !== target.id);
            } else if (target.type === 'RETURN') {
              updated.stockReturnNotes = (prev.stockReturnNotes || []).filter(r => r.id !== target.id);
            }
            return updated;
          });

          showToast('Đang tiến hành xóa chứng từ và giải phóng giữ chỗ...');
          const res = await authFetch(endpoint, { method: 'DELETE' });
          const json = await res.json();
          if (json.success) {
            showToast(json.message || 'Đã xóa chứng từ và giải phóng giữ chỗ thành công!');
            fetchState(true);
          } else {
            showToast(json.message || 'Lỗi khi xóa chứng từ', 'error');
            fetchState(true);
          }
        } catch (err) {
          showToast(err.message, 'error');
          fetchState(true);
        }
      };

      const handleResetSeed = async () => {
        if (!confirm('Bạn có chắc muốn khôi phục dữ liệu mẫu chuẩn MEVN vào Supabase PostgreSQL?')) return;
        try {
          const res = await authFetch('/api/reset-seed', { method: 'POST' });
          const json = await res.json();
          if (json.success) {
            setData(json.data);
            showToast(json.message);
          } else {
            showToast(json.message || 'Lỗi khôi phục mẫu', 'error');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleOpenPrintPreview = (type, doc) => {
        setPrintPreviewData({ type, doc });
        setActiveModal('PRINT');
      };

      const handleSelectOrder = (order) => {
        setSelectedOrder(order);
        setOrderDrawerOpen(true);
      };

      // Handler bundle with Role-Based Permission Guards
      const handlers = useMemo(() => ({
        onOpenOrderModal: () => {
          if (checkPerm('CREATE_ORDER', 'Tạo Đơn Hàng mới')) {
            setActiveModalTarget(null);
            setActiveModal('ORDER');
          }
        },
        onOpenBomModal: (order) => {
          if (checkPerm('SUBMIT_BOM', 'Nạp Bản Vẽ & Định Mức BOM')) {
            if (order) {
              setSelectedOrder(order);
              setActiveModalTarget(order);
            }
            setActiveModal('BOM');
          }
        },
        onOpenPoModal: (order) => {
          if (checkPerm('CREATE_PO', 'Phát Hành Đơn Mua Hàng PO')) {
            if (order) {
              setSelectedOrder(order);
              setActiveModalTarget(order);
            }
            setActiveModal('PO');
          }
        },
        onOpenGrnModal: (po) => {
          if (checkPerm('RECEIVE_GRN', 'Nhập Kho Hàng Về GRN')) {
            if (po) setActiveModalTarget(po);
            setActiveModal('GRN');
          }
        },
        onOpenPickupModal: (order) => {
          if (checkPerm('REGISTER_PICKUP', 'Đăng Ký Ca Lấy Vật Tư')) {
            if (order) {
              setSelectedOrder(order);
              setActiveModalTarget(order);
            }
            setActiveModal('PICKUP');
          }
        },
        onOpenGdnModal: (order) => {
          if (checkPerm('APPROVE_GDN', 'Lập Phiếu Xuất Kho')) {
            if (order) {
              setSelectedOrder(order);
              setActiveModalTarget(order);
            }
            setActiveModal('GDN');
          }
        },
        onOpenReturnModal: (order) => {
          if (checkPerm('CREATE_RETURN', 'Nhập Trả / Phế Phẩm')) {
            if (order) {
              setSelectedOrder(order);
              setActiveModalTarget(order);
            }
            setActiveModal('RETURN');
          }
        },
        onVerifyBom: (bomId) => {
          if (checkPerm('VERIFY_BOM', 'Đối Chiếu & Khóa Giữ Chỗ BOM')) handleVerifyBom(bomId);
        },
        onApproveGdn: (gdnId) => {
          if (checkPerm('APPROVE_GDN', 'Phê Duyệt Phiếu Xuất Kho GDN')) handleApproveGdn(gdnId);
        },
        onDispatchGdn: (gdnId) => {
          if (checkPerm('DISPATCH_GDN', 'Thực Xuất Kho & Ký Nhận')) handleDispatchGdn(gdnId);
        },
        onRequestDelete: (target) => {
          if (checkPerm('DELETE_DOCUMENT', 'Xóa chứng từ & Giải phóng giữ chỗ')) {
            setDeleteConfirmTarget(target);
          }
        },
      }), [checkPerm, handleVerifyBom, handleApproveGdn, handleDispatchGdn]);

      // Real-time Badge Counts for Sidebar
      const counts = useMemo(() => {
        if (!data) return {};
        const readyOrders = (data.orders || []).filter(o => o.status === 'SAN_SANG_XUAT').length;
        const pendingPo = (data.orders || []).filter(o => o.status === 'CHO_MUA').length;
        const pendingBom = (data.orders || []).filter(o => o.status === 'CHO_BOM' || o.status === 'MOI_NHAN').length;
        return {
          orders: (data.orders || []).length,
          pos: pendingPo,
          dispatch: readyOrders,
          boms: pendingBom,
          grns: (data.purchaseOrders || []).filter(p => p.status === 'CONFIRMED' || p.status === 'ORDERED').length,
        };
      }, [data]);

      // Safe component resolution from window.WMS_COMPONENTS
      const {
        LoginScreen,
        Header,
        Sidebar,
        MobileBottomDock,
        CommandPalette,
        OrderDrawer,
        DashboardTab,
        OrdersTab,
        InventoryTab,
        BomsTab,
        PosTab,
        GrnsTab,
        DispatchTab,
        ReturnsTab,
        KpiTab,
        LedgerTab,
        Modals
      } = window.WMS_COMPONENTS || {};

      // 1. If user is not authenticated, render Enterprise CAD Blueprint Login Screen immediately
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950">
            {toast && (
              <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-2xl text-white font-bold text-xs flex items-center gap-3 animate-fade-in transition-all border ${
                toast.type === 'error'
                  ? 'bg-red-600 border-red-500 shadow-red-500/20'
                  : 'bg-emerald-600 border-emerald-500 shadow-emerald-500/20'
              }`}>
                <i className={`fa-solid ${toast.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-sm`}></i>
                <span>{toast.msg}</span>
              </div>
            )}
            {LoginScreen ? (
              <LoginScreen
                onLoginSuccess={handleLoginSuccess}
                darkMode={darkMode}
                setDarkMode={setDarkMode}
              />
            ) : (
              <div className="flex items-center justify-center min-h-screen text-white font-bold font-mono">
                <i className="fa-solid fa-circle-notch fa-spin text-blue-500 mr-3"></i>
                Đang nạp Auth Terminal MEVN...
              </div>
            )}
          </div>
        );
      }

      // Safe fallback empty state for tabs when data is still streaming
      const safeData = data || {
        orders: [],
        boms: [],
        purchaseOrders: [],
        goodsReceiptNotes: [],
        pickupRegistrations: [],
        goodsDispatchNotes: [],
        stockReturnNotes: [],
        stockBalances: [],
        stockTransactions: [],
        users: [],
        warehouses: [],
        skus: [],
        uoms: [],
        suppliers: [],
        kpis: { orderFulfillmentRate: 0, bomAccuracyRate: 0, dispatchOnTimeRate: 0, activeStocktakeCount: 0 }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-2xl text-white font-bold text-xs flex items-center gap-3 animate-fade-in transition-all border ${
              toast.type === 'error'
                ? 'bg-red-600 border-red-500 shadow-red-500/20'
                : 'bg-emerald-600 border-emerald-500 shadow-emerald-500/20'
            }`}>
              <i className={`fa-solid ${toast.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-sm`}></i>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Top Enterprise Header */}
          {Header && (
            <Header
              currentUser={currentUser}
              setCurrentUser={handleSwitchUser}
              users={data?.users || []}
              darkMode={darkMode}
              setDarkMode={setDarkMode}
              onOpenCommandPalette={() => setCommandPaletteOpen(true)}
              onResetSeed={handleResetSeed}
              onLogout={handleLogout}
              sidebarCollapsed={sidebarCollapsed}
              setSidebarCollapsed={setSidebarCollapsed}
              mobileDrawerOpen={mobileDrawerOpen}
              setMobileDrawerOpen={setMobileDrawerOpen}
              isSyncing={isSyncing}
              onRefresh={() => fetchState(true)}
            />
          )}

          {/* Workspace Body */}
          <div className="flex-1 flex overflow-hidden">
            {/* Multi-tier Collapsible Sidebar & Mobile Slide-Over Drawer */}
            {Sidebar && (
              <Sidebar
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                collapsed={sidebarCollapsed}
                counts={counts}
                mobileDrawerOpen={mobileDrawerOpen}
                setMobileDrawerOpen={setMobileDrawerOpen}
                currentUser={currentUser}
                setCurrentUser={handleSwitchUser}
                users={data?.users || []}
                darkMode={darkMode}
                setDarkMode={setDarkMode}
                onOpenCommandPalette={() => setCommandPaletteOpen(true)}
                onLogout={handleLogout}
              />
            )}

            {/* Main Content Viewport */}
            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-28 md:pb-8">
              <div className="max-w-7xl mx-auto space-y-4">
                {/* Non-blocking background sync or connection alert */}
                {isInitialLoading && !data && (
                  <div className="p-4 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-between text-xs font-mono animate-pulse">
                    <div className="flex items-center gap-3">
                      <i className="fa-solid fa-circle-notch fa-spin text-sm"></i>
                      <span>Đang đồng bộ dữ liệu Supabase Cloud PostgreSQL & khởi tạo Sổ cái...</span>
                    </div>
                    <span className="text-[10px] bg-blue-500/20 px-2 py-0.5 rounded-full font-bold">LIVE SYNC</span>
                  </div>
                )}

                {fetchError && !data && (
                  <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-300 flex items-center justify-between text-xs">
                    <div className="flex items-center gap-3">
                      <i className="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
                      <span>{fetchError}</span>
                    </div>
                    <button
                      onClick={() => fetchState(false)}
                      className="px-3 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 text-amber-200 font-bold transition"
                    >
                      Thử Lại
                    </button>
                  </div>
                )}

                {activeTab === 'dashboard' && DashboardTab && (
                  <DashboardTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onNavigateTab={setActiveTab}
                    onSelectOrder={handleSelectOrder}
                  />
                )}

                {activeTab === 'orders' && OrdersTab && (
                  <OrdersTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onSelectOrder={handleSelectOrder}
                    onOpenPrintPreview={handleOpenPrintPreview}
                  />
                )}

                {activeTab === 'inventory' && InventoryTab && (
                  <InventoryTab
                    data={safeData}
                    currentUser={currentUser}
                  />
                )}

                {activeTab === 'boms' && BomsTab && (
                  <BomsTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onSelectOrder={handleSelectOrder}
                    onOpenPrintPreview={handleOpenPrintPreview}
                  />
                )}

                {activeTab === 'pos' && PosTab && (
                  <PosTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onOpenPrintPreview={handleOpenPrintPreview}
                  />
                )}

                {activeTab === 'grns' && GrnsTab && (
                  <GrnsTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onOpenPrintPreview={handleOpenPrintPreview}
                  />
                )}

                {activeTab === 'dispatch' && DispatchTab && (
                  <DispatchTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onOpenPrintPreview={handleOpenPrintPreview}
                  />
                )}

                {activeTab === 'returns' && ReturnsTab && (
                  <ReturnsTab
                    data={safeData}
                    currentUser={currentUser}
                    handlers={handlers}
                    onOpenPrintPreview={handleOpenPrintPreview}
                  />
                )}

                {activeTab === 'kpi' && KpiTab && (
                  <KpiTab
                    data={safeData}
                  />
                )}

                {activeTab === 'ledger' && LedgerTab && (
                  <LedgerTab
                    data={safeData}
                    currentUser={currentUser}
                  />
                )}
              </div>
            </main>
          </div>

          {/* Universal Command Palette (Ctrl+K) */}
          {CommandPalette && (
            <CommandPalette
              isOpen={commandPaletteOpen}
              onClose={() => setCommandPaletteOpen(false)}
              data={data}
              onSelectOrder={handleSelectOrder}
              onNavigateTab={setActiveTab}
            />
          )}

          {/* iOS 26 Floating Liquid Bottom Dock for iPhone & Android */}
          {MobileBottomDock && (
            <MobileBottomDock
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              counts={counts}
              data={data}
              currentUser={currentUser}
              onOpenCommandPalette={() => setCommandPaletteOpen(true)}
            />
          )}

          {/* Slide-over Deep Order Inspector Drawer */}
          {OrderDrawer && (
            <OrderDrawer
              isOpen={orderDrawerOpen}
              onClose={() => setOrderDrawerOpen(false)}
              order={selectedOrder}
              data={data}
              currentUser={currentUser}
              handlers={handlers}
              onOpenPrintPreview={handleOpenPrintPreview}
            />
          )}

          {/* Modal Suite & ISO Print Engine & Delete Confirmation */}
          {Modals && (
            <Modals
              data={data}
              currentUser={currentUser}
              activeModal={activeModal}
              activeModalTarget={activeModalTarget || selectedOrder}
              onClose={() => {
                setActiveModal(null);
                setActiveModalTarget(null);
              }}
              onSubmitOrder={handleCreateOrder}
              onSubmitBom={handleCreateBom}
              onSubmitPo={handleCreatePo}
              onSubmitGrn={handleCreateGrn}
              onSubmitPickup={handleCreatePickup}
              onSubmitGdn={handleCreateGdn}
              onSubmitReturn={handleCreateReturn}
              printPreviewData={printPreviewData}
              deleteConfirmTarget={deleteConfirmTarget}
              onConfirmDelete={handleDeleteEntity}
              onCancelDelete={() => setDeleteConfirmTarget(null)}
            />
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
